version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/Application"
      - "/Domain"
      - "/Infrastructure"
      - "/WebUI"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Routine major upgrades require a coordinated framework migration.
    # allow.update-types affects version updates only, never security updates.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      shared-packages:
        group-by: dependency-name
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
