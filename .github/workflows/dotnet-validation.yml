name: .NET validation

on:
  push:
    branches:
      - fix/audit-2026-11-22
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: dotnet-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install .NET SDK 7 (legacy compatibility validation only)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Restore dependencies
        run: dotnet restore WebUI/WebUI.csproj
      - name: Build without running application or accessing production data
        run: dotnet build WebUI/WebUI.csproj --configuration Release --no-restore
