<div ng-controller="ticketController as vm" ng-init="vm.initializeController()">
    <div class="container">
        <div class="card" id="ai-queue" aria-labelledby="ai-queue-title">

            <div class="row" style="margin-bottom:40px">
                <div class="col-md-10">
                    <h1 style="margin-top:20px;text-align:left!important;margin-bottom:0!important">
                        <span style="font-size: 30px !important" class="sub-gradient">Documents</span>
                    </h1>
                </div>
                <div style="margin-top:25px" class="col-md-2">
                    <a ng-click="vm.resetItem()" data-dismiss="modal" data-bs-toggle="modal" data-bs-target="#addTicketModal"
                       class="box3 btn primary" style="float: right;" href="#!/login">Add</a>
                </div>
            </div>

            <div class="custom_table table-responsive">
                <table style="font-size: 15px !important; font-weight: 200 !important; font-family: myFirstFont!important"
                       ng-table="vm.tableParams" show-filter="showFilter"
                       class="table table-striped responsive-table">
                    <tbody>
                        <tr style="text-align:center"
                            ng-repeat="row in $data track by row.Id">
                            <td data-title="'#'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{$index + 1}}</a>
                                </h6>
                            </td>
                            <td data-title="'Number'"
                                filter="{Number: 'text'}" sortable="'Number'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{row.Number}}</a>
                                </h6>
                            </td>
                            <td data-title="'Title'"
                                filter="{Title: 'text'}" sortable="'Title'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{row.Title}}</a>
                                </h6>
                            </td>
                            <td data-title="'CreateDate'"
                                filter="{CreateDate: 'text'}" sortable="'CreateDate'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{row.CreateDate}}</a>
                                </h6>
                            </td>
                            <td data-title="'Priority'"
                                filter="{Priority: 'text'}" sortable="'Priority'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>
                                        {{vm.priorities[row.Priority].title}}
                                    </a>
                                </h6>
                            </td>
                            <td data-title="'Status'"
                                filter="{Status: 'text'}" sortable="'Status'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>
                                        {{vm.ticketStatuses[row.Status].title}}
                                    </a>
                                </h6>
                            </td>
                            <td data-title="'Operation'">
                                <span style="cursor:pointer;color:cornflowerblue">
                                    <i title="See" ng-click="vm.getRow(row)"
                                       data-dismiss="modal" data-bs-toggle="modal" data-bs-target="#seeTicketModal"
                                       class="icofont-eye"></i>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="modal fade" id="addTicketModal" tabindex="-1" aria-labelledby="addOrUpdateModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content modal-lg ">

                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
                </div>

                <div class="modal-body text-center">
                    <div class="row">
                        <div class="field col-md-6">
                            <label style="float:left!important">Title</label>
                            <input ng-model="vm.item.Title" type="text">
                        </div>
                        <div class="field col-md-6">
                            <label style="float:left!important">Priority</label>
                            <select name="Priority" class="form-control" ng-model="vm.item.Priority"
                                    ng-init="vm.item.Priority || vm.priorities[0].id"
                                    ng-options="option.id as option.title for option in vm.priorities"
                                    required>
                            </select>
                        </div>
                        <div class="field col-md-12">
                            <label style="float:left!important">Text</label>
                            <textarea class="my_textarea" ng-model="vm.item.TextMessage"></textarea>
                        </div>

                        <div style="margin-top:20px">
                            <input type="file" accept="image/jpg, image/jpeg, image/png, application/pdf"
                                   ngf-select="UploadTicketFile($files)" />
                        </div>
                        <div style="margin-top:20px">
                            <div style="width: 100%!important;" class="myprogress progress-percent-bg">
                                <div style="width:auto!important;padding:10px!important" id="dvProgress1" ng-show="Progress >= 0"
                                     class="progress-bar progress-bar-striped bg-info">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="box3 btn ghost" data-bs-dismiss="modal">Close</button>
                    <button ng-click="vm.addTicket()" type="button" class="box3 btn btn-danger" id="confirmDelete">Save</button>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="seeTicketModal" tabindex="-1" aria-labelledby="addOrUpdateModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content modal-xl">

                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
                </div>

                <div class="modal-body text-center">
                    <div class="row">
                        <div ng-repeat="message in vm.item.Messages" style="cursor: pointer;">
                            <div style="margin-bottom: 10px; padding: 15px" ng-class="{'chatFrom':message.Right,'chatTo':!message.Right}">
                                <textarea readonly style="border:0px;resize:none;width:100%;height:60px;background-color:transparent;">{{message.TextMessage}}</textarea>
                                <a ng-if="message.FileName" style="float:right;" class="btn ghost"
                                   href="{{$root.domain}}/Content/ticketFiles/{{message.FileName}}">Download Attachment</a>
                                <label style="float:left;background-color:transparent;">{{message.CreateDate}}</label>
                            </div>
                        </div>

                        <hr style="margin-top:40px!important"/>

                        <div class="field col-md-12">
                            <label style="float:left!important">Text</label>
                            <textarea class="my_textarea" ng-model="vm.item.TextMessage"></textarea>
                        </div>

                        <div style="margin-top:20px">
                            <input type="file" accept="image/jpg, image/jpeg, image/png, application/pdf"
                                   ngf-select="UploadTicketMessageFile($files)" />
                        </div>
                        <div style="margin-top:20px">
                            <div style="width: 100%!important;" class="myprogress progress-percent-bg">
                                <div style="width:auto!important;padding:10px!important" id="dvProgress2" ng-show="Progress >= 0"
                                     class="progress-bar progress-bar-striped bg-info">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="box3 btn ghost" data-bs-dismiss="modal">Close</button>
                    <button ng-click="vm.addOrUpdateTicketMessage()" type="button" class="box3 btn btn-danger" id="confirmDelete">Send</button>
                </div>

            </div>
        </div>
    </div>

</div>
