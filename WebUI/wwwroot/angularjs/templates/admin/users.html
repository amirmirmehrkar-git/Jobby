<div ng-controller="userController as vm" ng-init="vm.initializeController()">
    <div class="container">
        <div class="card" id="ai-queue" aria-labelledby="ai-queue-title">

            <div class="custom_table table-responsive">
                <table ng-table="vm.tableParams" show-filter="showFilter"
                       class="table table-striped responsive-table">
                    <tbody>
                        <tr style="text-align:center"
                            ng-repeat="row in $data track by row.Id">
                            <td data-title="'#'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{$index + 1}}</a>
                                </h6>
                            </td>
                            <td data-title="'FullName'"
                                filter="{FullName: 'text'}" sortable="'FullName'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{row.FullName}}</a>
                                </h6>
                            </td>
                            <td data-title="'Email'"
                                filter="{PhoneNumber: 'text'}" sortable="'PhoneNumber'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{row.PhoneNumber}}</a>
                                </h6>
                            </td>
                            <td data-title="'Join Date'"
                                filter="{CreateDate: 'ng-table/filters/datePicker.html'}" sortable="'PhoneNumber'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{row.CreateDate}}</a>
                                </h6>
                            </td>
                            <td data-title="'Operation'">
                                <span style="cursor:pointer;color:red">
                                    <i title="Delete" ng-click="vm.getRow(row)"
                                       data-dismiss="modal" data-bs-toggle="modal" data-bs-target="#deleteModal"
                                       class="icofont-ui-delete"></i>
                                </span>
                                <span style="cursor:pointer;color:cornflowerblue">
                                    <i title="Edit" ng-click="vm.getRow(row)"
                                       data-dismiss="modal" data-toggle="modal" data-target="#addUserModal"
                                       class="icofont-pencil"></i>
                                </span>
                                <span style="cursor:pointer;color:forestgreen">
                                    <i title="Enter" ng-click="vm.loginWithToken(row)"
                                       class="icofont-arrow-right"></i>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
   
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
                </div>

                <div class="modal-body text-center">
                    Are you sure you want to delete this item?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn ghost" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">Yes</button>
                </div>

            </div>
        </div>
    </div>
