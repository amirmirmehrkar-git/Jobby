<div ng-controller="dashboardController as vm" ng-init="vm.initializeController()">
    <div class="wrap">

        <div class="d-flex">
            <a style="margin-right:30px" class="brand">
                <div class="logo-mark">
                    <img src="/images/logo.png" style="height:40px">
                </div>

                <div class="logo-all">
                    <div class="step-title" style="margin-bottom:5px;font-weight:800">Easy Actions</div>
                    <div class="logoBottomTitle">Your AI career co-pilot</div>
                </div>
            </a>
            <div style="text-align:center;margin-bottom:26px;margin-top:50px">
                <h2 class="box4" style="margin-bottom:8px">
                    <span style="font-size: 42px" class="gradient-text">
                        Admin Dashboard
                    </span>
                </h2>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4" style="padding: 0px 30px 30px 30px">
                <div class="card2 blue row">
                    <div class="col-md-8">
                        <div class="title2">Total Users</div>
                        <div class="value">{{vm.TotalEmails}}</div>
                    </div>
                    <div class="icon col-md-4" style="background: linear-gradient(135deg,#6f45ff,#9b5bff);">
                        <i class="ti ti-mail"></i>
                    </div>
                </div>
            </div>

            <div class="col-md-4" style="padding: 0px 30px 30px 30px">
                <div class="card2 purple row">
                    <div class="col-md-8">
                        <div class="title2">Total Tickets</div>
                        <div class="value">{{vm.Unreads}}</div>
                    </div>
                    <div class="icon col-md-4" style="background: linear-gradient(135deg,#a144ff,#c067ff);">
                        <i class="ti ti-eye"></i>
                    </div>
                </div>
            </div>

            <div class="col-md-4" style="padding: 0px 30px 30px 30px">
                <div class="card2 pink row">
                    <div class="col-md-8">
                        <div class="title2">Total Blogs</div>
                        <div class="value">{{vm.AICount}}</div>
                    </div>
                    <div class="icon col-md-4" style="background: linear-gradient(135deg,#ff3e7f,#ff6fa1);">
                        <i class="ti ti-brand-days-counter"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
